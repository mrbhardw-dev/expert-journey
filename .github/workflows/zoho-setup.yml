name: SuperGear Motors Ltd

# Pull request that touches the setup config -> dry run on production (shows what would change).
# Merge into the default branch -> apply on production (after the environment's required approval).
# Or run by hand from the Actions tab. Credentials come from the chosen GitHub environment's secrets.
on:
  pull_request:
    paths:
      - "config/**"
      - "zoho_setup/**"
      - ".github/workflows/zoho-setup.yml"
  push:
    branches: [claude/cool-mayer-81nta8]
    paths:
      - "config/**"
      - "zoho_setup/**"
      - ".github/workflows/zoho-setup.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "Where to set up (sandbox = CRM Sandbox + test Books org)"
        type: choice
        options: [sandbox, production]
        default: sandbox
      step:
        description: "What to set up"
        type: choice
        options: [all, crm-schema, crm-views, books-config]
        default: all
      apply:
        description: "Apply changes (unticked = dry run, nothing is changed)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: zoho-setup-${{ inputs.target || 'production' }}
  cancel-in-progress: false

jobs:
  deployment:
    runs-on: ubuntu-latest
    # "production" has required reviewers, so every run (PR dry run or merge apply) waits for approval.
    environment: ${{ inputs.target || 'production' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Deploy to Zoho
        env:
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
          ZOHO_ACCOUNTS_URL: ${{ vars.ZOHO_ACCOUNTS_URL }}
          ZOHO_CRM_API_DOMAIN: ${{ vars.ZOHO_CRM_API_DOMAIN }}
          ZOHO_BOOKS_API_DOMAIN: ${{ vars.ZOHO_BOOKS_API_DOMAIN }}
          ZOHO_BOOKS_ORG_ID: ${{ vars.ZOHO_BOOKS_ORG_ID }}
          STEP: ${{ inputs.step || 'all' }}
          APPLY: ${{ github.event_name == 'push' || inputs.apply }}
        run: |
          if [ "$APPLY" = "true" ]; then
            python -m zoho_setup "$STEP" --apply
          else
            python -m zoho_setup "$STEP"
          fi
